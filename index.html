<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>YouTube Downloader</h1>
        <input type="text" id="youtube-url" placeholder="Enter YouTube URL">
        <button id="download-button">Get Download Options</button>

        <div id="download-options">
            <!-- Download options will be displayed here -->
            <option value="mp4">MP4</option>
            <option value="mp3">MP3</option>
            <option value="webm">WebM</option>
        </div>
        
        <div id="status-message">
            <!-- Any status messages can be shown here (e.g. 'processing', 'error', etc.) -->
            
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
